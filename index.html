<title>Hanzi Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root {
    --ink: #232a36;
    --ink-soft: #4b5563;
    --paper: #eef2ee;
    --paper-raised: #ffffff;
    --grid: #c7d0c9;
    --grid-strong: #aab6ac;
    --seal: #ac3a2e;
    --seal-ink: #ffffff;
    --brass: #8a6a2e;
    --muted: #6b7280;
    --ring: rgba(172,58,46,0.35);
    --shadow: rgba(35,42,54,0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #e8e6df; --ink-soft: #b7bcc6; --paper: #12161d; --paper-raised: #1b212a;
      --grid: #333c48; --grid-strong: #47515f; --seal: #e07567; --seal-ink: #1b1210;
      --brass: #d3ac6a; --muted: #8b93a1; --ring: rgba(224,117,103,0.35); --shadow: rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --ink: #e8e6df; --ink-soft: #b7bcc6; --paper: #12161d; --paper-raised: #1b212a;
    --grid: #333c48; --grid-strong: #47515f; --seal: #e07567; --seal-ink: #1b1210;
    --brass: #d3ac6a; --muted: #8b93a1; --ring: rgba(224,117,103,0.35); --shadow: rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "Work Sans", ui-sans-serif, system-ui, sans-serif;
    padding-inline: 16px; padding-block: 28px;
    display: flex; justify-content: center;
  }
  .page { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 18px; }
  .masthead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .masthead h1 { font-family: "Noto Serif TC", serif; font-weight: 700; font-size: clamp(22px, 5vw, 28px); margin: 0; text-wrap: balance; }
  .progress { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; font-weight: 500; white-space: nowrap; }
  .toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .category-tag {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--brass);
    background: color-mix(in srgb, var(--brass) 14%, var(--paper-raised));
    border: 1px solid color-mix(in srgb, var(--brass) 35%, transparent);
    border-radius: 999px; padding: 4px 10px;
  }
  .toggle { display: inline-flex; background: var(--paper-raised); border: 1px solid var(--grid-strong); border-radius: 999px; padding: 3px; gap: 3px; box-shadow: 0 1px 2px var(--shadow); }
  .toggle button { border: none; background: transparent; color: var(--ink-soft); font-family: inherit; font-size: 13px; font-weight: 600; padding: 7px 16px; border-radius: 999px; cursor: pointer; }
  .toggle button.active { background: var(--seal); color: var(--seal-ink); }
  .card { background: var(--paper-raised); border-radius: 20px; padding: 26px 22px 22px; box-shadow: 0 1px 3px var(--shadow), 0 12px 28px -18px var(--shadow); display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .char-row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .char-box {
    position: relative; border-radius: 14px; border: 1.5px solid var(--grid-strong);
    background:
      linear-gradient(45deg, transparent calc(50% - 0.75px), var(--grid) calc(50% - 0.75px), var(--grid) calc(50% + 0.75px), transparent calc(50% + 0.75px)),
      linear-gradient(-45deg, transparent calc(50% - 0.75px), var(--grid) calc(50% - 0.75px), var(--grid) calc(50% + 0.75px), transparent calc(50% + 0.75px)),
      linear-gradient(var(--grid), var(--grid)) center / 100% 1.5px no-repeat,
      linear-gradient(var(--grid), var(--grid)) center / 1.5px 100% no-repeat,
      var(--paper-raised);
    transition: box-shadow 0.25s ease; touch-action: none;
  }
  .char-box.done { box-shadow: 0 0 0 3px var(--ring); }
  .char-box svg { position: relative; z-index: 1; }
  .caption { text-align: center; display: flex; flex-direction: column; gap: 2px; }
  .caption .pinyin { font-weight: 600; color: var(--brass); font-size: 17px; }
  .caption .english { color: var(--muted); font-style: italic; font-size: 14px; }
  .controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; width: 100%; }
  button.action { font-family: inherit; font-size: 14px; font-weight: 600; border-radius: 10px; padding: 10px 16px; cursor: pointer; border: 1.5px solid var(--grid-strong); background: var(--paper-raised); color: var(--ink); }
  button.action:focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; }
  button.primary { background: var(--seal); border-color: var(--seal); color: var(--seal-ink); }
  button.action:disabled { opacity: 0.4; cursor: default; }
  .jump-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .jump-row button { font-family: inherit; font-size: 12px; font-weight: 600; border-radius: 8px; padding: 5px 10px; cursor: pointer; border: 1px solid var(--grid-strong); background: var(--paper-raised); color: var(--ink-soft); }
  .jump-row button.active { background: var(--ink); color: var(--paper-raised); border-color: var(--ink); }
  footer.note { text-align: center; color: var(--muted); font-size: 12.5px; line-height: 1.5; }
  @media (prefers-reduced-motion: reduce) { .char-box { transition: none; } }
</style>

    var row = document.getElementById("jumpRow");
    var cats = [];
    WORDS.forEach(function(w){ if (cats.indexOf(w.category) === -1) cats.push(w.category); });
    cats.forEach(function(cat){
      var btn = document.createElement("button");
      btn.type = "button"; btn.textContent = cat; btn.dataset.cat = cat;
      btn.addEventListener("click", function(){
        var i = WORDS.findIndex(function(w){ return w.category === cat; });
        if (i !== -1){ state.index = i; render(); }
      });
      row.appendChild(btn);
    });
  }

  function updateJumpRow(){
    var current = WORDS[state.index].category;
    document.querySelectorAll("#jumpRow button").forEach(function(b){
      b.classList.toggle("active", b.dataset.cat === current);
    });
  }

  function render(){
    var word = WORDS[state.index];
    var chars = word[state.mode === "simplified" ? "simp" : "trad"];
    var row = document.getElementById("charRow");
    row.innerHTML = "";
    writers = [];
    var boxSize = chars.length === 1 ? 300 : (chars.length === 2 ? 230 : 180);
    var boxItems = chars.map(function(ch){
      var box = document.createElement("div");
      box.className = "char-box";
      box.style.width = boxSize + "px";
      box.style.height = boxSize + "px";
      row.appendChild(box);
      return { ch: ch, box: box };
    });
    boxItems.forEach(function(item){
      var size = boxSize;
      var writer = HanziWriter.create(item.box, item.ch, {
        width: size, height: size, padding: Math.round(size * 0.08),
        strokeAnimationSpeed: 1, delayBetweenStrokes: 150, showOutline: true,
        strokeColor: getComputedColor("--ink"), outlineColor: getComputedColor("--grid-strong"),
        drawingWidth: 32, charDataLoader: charDataLoader,
        onLoadCharDataError: function(){
          item.box.innerHTML = "<div style='display:flex;align-items:center;justify-content:center;height:100%;font-size:12px;color:var(--muted);text-align:center;padding:8px;'>No stroke data for this character yet</div>";
        }
      });
      writer.quiz({ onComplete: function(){ item.box.classList.add("done"); } });
      writers.push({ writer: writer, box: item.box });
    });
    document.getElementById("pinyin").textContent = word.pinyin;
    document.getElementById("english").textContent = word.english;
    document.getElementById("categoryTag").textContent = word.category;
    document.getElementById("progress").textContent = (state.index + 1) + " / " + WORDS.length;
    document.getElementById("prevBtn").disabled = state.index === 0;
    document.getElementById("nextBtn").disabled = state.index === WORDS.length - 1;
    updateJumpRow();
  }

  function getComputedColor(varName){
    return getComputedStyle(document.documentElement).getPropertyValue(varName).trim() || "#232a36";
  }

  document.getElementById("prevBtn").addEventListener("click", function(){ if (state.index > 0){ state.index -= 1; render(); } });
  document.getElementById("nextBtn").addEventListener("click", function(){ if (state.index < WORDS.length - 1){ state.index += 1; render(); } });
  document.getElementById("showBtn").addEventListener("click", function(){
    writers.forEach(function(w){
      w.box.classList.remove("done");
      w.writer.animateCharacter({ onComplete: function(){ w.writer.quiz({ onComplete: function(){ w.box.classList.add("done"); } }); } });
    });
  });
  document.getElementById("scriptToggle").addEventListener("click", function(e){
    var btn = e.target.closest("button[data-mode]");
    if (!btn) return;
    state.mode = btn.getAttribute("data-mode");
    document.querySelectorAll("#scriptToggle button").forEach(function(b){ b.classList.toggle("active", b === btn); });
    render();
  });

  buildJumpRow();
  render();
})();
</script>
